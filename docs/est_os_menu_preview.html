  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

@media (pointer: coarse) {

  .form-control,

          drawCentered(84, recent &amp;&amp; recent.saved ? recent.name : t(&#x27;noRecent&#x27;), &#x27;compact&#x27;);
        }
        [0, 1, 2].forEach(index =&gt; {
          const x = 76 + index * 14;
          drawLine(x, 106, x + 7, 106);
        });
        fillRegion(Math.round(76 + firstIndex * 14), 105, 8, 3, true);
        drawStatus();
      }

      function drawControlPlaceholder(action) {
        drawPageTitle(t(action));
        drawBitmap(74, 35, firmwareIcons[action], false);
        drawCentered(82, &#x27;--&#x27;);
        drawStatus();
      }

      function drawPageTitle(title) {
        drawText(3, 1, title);
        drawLine(0, 18, LCD_WIDTH - 1, 18);
      }

      function remoteChannelLabel() {
        return remoteChannelGroups[remoteChannelGroupIndex].label;
      }

      function nextRemoteChannelLabel() {
        return remoteChannelGroups[(remoteChannelGroupIndex + 1) % remoteChannelGroups.length].label;
      }

      function isRemoteFaultScenario(scenario) {
        return scenario === &#x27;remote-no-ir&#x27; || scenario === &#x27;remote-signal-lost&#x27; || scenario === &#x27;remote-device-lost&#x27;;
      }

      function currentRemoteFault() {
        if (previewScenario === &#x27;remote-no-ir&#x27;) return { message: t(&#x27;remoteConnectIr&#x27;), reason: &#x27;no-ir&#x27; };
        if (previewScenario === &#x27;remote-signal-lost&#x27;) return { message: t(&#x27;remoteSignalLost&#x27;), reason: `signal-timeout-${REMOTE_SIGNAL_TIMEOUT_MS}ms` };
        if (previewScenario === &#x27;remote-device-lost&#x27;) return { message: t(&#x27;remoteDeviceLost&#x27;), reason: &#x27;device-lost&#x27; };
        return null;
      }

      function brakeRemoteMotors(reason) {
        remoteOutputEnabled = false;
        remoteMotorsBraked = true;
        remoteBrakeReason = reason;
      }

      function resetRemoteControl() {
        remoteChannelGroupIndex = 0;
        brakeRemoteMotors(&#x27;reset&#x27;);
      }

      function enterRemoteControl() {
        resetRemoteControl();
        page = &#x27;remote&#x27;;
      }

      function switchRemoteChannelGroup() {
        brakeRemoteMotors(&#x27;channel-switch&#x27;);
        remoteChannelGroupIndex = (remoteChannelGroupIndex + 1) % remoteChannelGroups.length;
      }

      function leaveRemoteControl() {
        brakeRemoteMotors(&#x27;back&#x27;);
        page = &#x27;main&#x27;;
      }

      function drawRemoteHeader() {
        const battery = `BAT ${batteryPercent()}%`;
        const batteryStyle = previewScenario === &#x27;low-battery&#x27; ? &#x27;compact-inverse&#x27; : &#x27;compact&#x27;;
        const batteryWidth = textWidth(battery, &#x27;compact&#x27;);
        const channel = remoteChannelLabel();
        const channelX = LCD_WIDTH - batteryWidth - textWidth(channel, &#x27;compact&#x27;) - 12;
        drawText(3, 1, t(&#x27;remoteTitle&#x27;));
        drawText(channelX, 1, channel, &#x27;compact&#x27;);
        drawText(LCD_WIDTH - batteryWidth - 3, 1, battery, batteryStyle);
        drawLine(0, 18, LCD_WIDTH - 1, 18);
      }

      function drawRemoteRow(y, label, value) {
        drawLabelPrefix(4, y, label);
        drawTextRight(y, value);
      }

      function drawRemoteControl() {
        const fault = currentRemoteFault();
        const group = remoteChannelGroups[remoteChannelGroupIndex];
        drawRemoteHeader();
        if (fault) {
          brakeRemoteMotors(fault.reason);
          drawCentered(43, fault.message);
          drawCentered(71, t(&#x27;remoteBrakeAll&#x27;), &#x27;compact&#x27;);
          drawCentered(94, &#x27;PWR: --&#x27;, &#x27;compact&#x27;);
        } else {
          drawRemoteRow(25, &#x27;IR 4&#x27;, t(&#x27;connected&#x27;));
          drawRemoteRow(42, group.channels[0].label, group.channels[0].motors);
          drawRemoteRow(59, group.channels[1].label, group.channels[1].motors);
          drawRemoteRow(76, &#x27;PWR&#x27;, &#x27;100%&#x27;);
          drawRemoteRow(93, &#x27;STOP&#x27;, &#x27;BRAKE&#x27;);
        }
        const hint = `${t(&#x27;remoteOk&#x27;)} ${nextRemoteChannelLabel()}`;
        drawText(LCD_WIDTH - textWidth(hint, &#x27;compact&#x27;) - 4, 112, hint, &#x27;compact&#x27;);
      }

      function motorOutputStateText(state) {
        if (state === &#x27;forward&#x27;) return t(&#x27;motorForward&#x27;);
        if (state === &#x27;reverse&#x27;) return t(&#x27;motorReverse&#x27;);
        return t(&#x27;motorStop&#x27;);
      }

      function motorOutputPower() {
        return motorOutputPowerLevels[motorOutputPowerIndex];
      }

      function cycleMotorOutput(portKey) {
        const motor = motorOutputPorts.find(item =&gt; item.key === portKey);
        if (!motor) return;
        const nextIndex = (motorOutputStateOrder.indexOf(motor.state) + 1) % motorOutputStateOrder.length;
        motor.state = motorOutputStateOrder[nextIndex];
      }

      function cycleMotorOutputPower() {
        motorOutputPowerIndex = (motorOutputPowerIndex + 1) % motorOutputPowerLevels.length;
      }

      function stopMotorOutput() {
        motorOutputPorts.forEach(motor =&gt; { motor.state = &#x27;stop&#x27;; });
      }

      function drawMotorOutputBox(motor) {
        const width = 48;
        const height = 21;
        const active = motor.state !== &#x27;stop&#x27;;
        const style = active ? &#x27;compact-inverse&#x27; : &#x27;compact&#x27;;
        if (active) fillRegion(motor.x + 1, motor.y + 1, width - 2, height - 2, true);
        drawLine(motor.x, motor.y, motor.x + width - 1, motor.y);
        drawLine(motor.x, motor.y + height - 1, motor.x + width - 1, motor.y + height - 1);
        drawLine(motor.x, motor.y, motor.x, motor.y + height - 1);
        drawLine(motor.x + width - 1, motor.y, motor.x + width - 1, motor.y + height - 1);
        const label = `${motor.port} ${motorOutputStateText(motor.state)}`;
        drawText(motor.x + Math.max(3, Math.floor((width - textWidth(label, &#x27;compact&#x27;)) / 2)), motor.y + 3, label, style);
      }

      function drawMotorOutput() {
        drawPageTitle(t(&#x27;motorOutputTitle&#x27;));
        motorOutputPorts.forEach(drawMotorOutputBox);
        const hint = `${t(&#x27;remoteOk&#x27;)} ${t(&#x27;motorPower&#x27;)} ${motorOutputPower()}%`;
        drawCentered(111, hint, &#x27;compact&#x27;);
      }

      function drawPanel(x, y, width, height) {
        fillRegion(x + 3, y + 3, width, height, true);
        fillRegion(x, y, width, height, false);
        drawLine(x, y, x + width - 1, y);
        drawLine(x, y + height - 1, x + width - 1, y + height - 1);
        drawLine(x, y, x, y + height - 1);
        drawLine(x + width - 1, y, x + width - 1, y + height - 1);
      }

      function drawCenteredIn(x, width, y, text, style = &#x27;normal&#x27;) {
        drawText(x + Math.max(0, Math.floor((width - textWidth(text, style)) / 2)), y, text, style);
      }

      function drawPowerConfirm() {
        const x = 18;
        const y = 38;
        const width = 144;
        const title = t(&#x27;powerOffPrompt&#x27;);
        const labelY = y + 34;
        const backX = x + 18;
        const okX = x + 85;
        drawPanel(x, y, width, 52);
        drawCenteredIn(x, width, y + 8, title);
        drawLine(x + 7, y + 31, x + width - 8, y + 31);
        drawText(backX, labelY, &#x27;&lt;&#x27;, &#x27;compact&#x27;);
        drawText(backX + 12, labelY, t(&#x27;backCancel&#x27;), &#x27;compact&#x27;);
        drawText(okX - 2, labelY, &#x27;✓&#x27;);
        drawText(okX + 14, labelY, t(&#x27;okPowerOff&#x27;), &#x27;compact&#x27;);
      }

      function drawProgressBar(x, y, width, height, progress) {
        const fillWidth = Math.max(0, Math.min(width - 2, Math.round((width - 2) * progress)));
        drawLine(x, y, x + width - 1, y);
        drawLine(x, y + height - 1, x + width - 1, y + height - 1);
        drawLine(x, y, x, y + height - 1);
        drawLine(x + width - 1, y, x + width - 1, y + height - 1);
        if (fillWidth &gt; 0) fillRegion(x + 1, y + 1, fillWidth, height - 2, true);
      }

      function drawProgramTransferPopup() {
        const x = 20;
        const y = 39;
        const width = 140;
        drawPanel(x, y, width, 52);
        drawCenteredIn(x, width, y + 8, t(&#x27;transferTitle&#x27;));
        drawCenteredIn(x, width, y + 25, t(&#x27;transferBody&#x27;), &#x27;compact&#x27;);
        drawProgressBar(x + 16, y + 40, width - 32, 5, transferProgress);
      }

      function drawPrograms() {
        drawPageTitle(t(&#x27;programs&#x27;));
        if (previewScenario === &#x27;storage-error&#x27;) {
          drawCentered(38, t(&#x27;storageError&#x27;));
          drawCentered(62, t(&#x27;storageReadFailed&#x27;), &#x27;compact&#x27;);
          drawCentered(88, &#x27;E:1002&#x27;);
          return;
        }
        const items = visiblePrograms();
        if (items.length === 0) {
          drawCentered(56, t(&#x27;noPrograms&#x27;));
          return;
        }
        const deleteHint = t(&#x27;deleteHint&#x27;);
        drawText(LCD_WIDTH - textWidth(deleteHint, &#x27;compact&#x27;) - 3, 1, deleteHint, &#x27;compact&#x27;);
        const first = programIndex &lt; 5 ? 0 : programIndex - 4;
        items.slice(first, first + 5).forEach((program, rowIndex) =&gt; {
          const index = first + rowIndex;
          const y = 22 + rowIndex * 20;
          const selected = index === programIndex;
          const style = selected ? &#x27;compact-inverse&#x27; : &#x27;compact&#x27;;
          if (selected) fillRegion(1, y, LCD_WIDTH - 2, 16, true);
          drawText(4, y, `${program.id}:`, style);
          drawText(22, y, program.name, style);
        });
      }

      function drawDeleteConfirm() {
        const program = selectedProgram();
        drawPageTitle(t(&#x27;deleteProgram&#x27;));
        if (program) drawCentered(27, program.name, &#x27;compact&#x27;);
        drawCentered(49, t(&#x27;deleteIrreversible&#x27;), &#x27;compact&#x27;);
        drawText(23, 94, t(&#x27;cancel&#x27;), deleteChoice === 0 ? &#x27;inverse&#x27; : &#x27;normal&#x27;);
        drawText(112, 94, t(&#x27;delete&#x27;), deleteChoice === 1 ? &#x27;inverse&#x27; : &#x27;normal&#x27;);
      }

      function drawRunning() {
        drawCentered(56, t(&#x27;running&#x27;));
      }

      function drawLabelPrefix(x, y, label) {
        const width = textWidth(label, &#x27;compact&#x27;);
        drawText(x, y, label, &#x27;compact&#x27;);
        drawText(x + width, y, &#x27;:&#x27;, &#x27;compact&#x27;);
        return x + width + 9;
      }

      function drawTextRight(y, text) {
        drawText(LCD_WIDTH - textWidth(text, &#x27;compact&#x27;) - 3, y, text, &#x27;compact&#x27;);
      }

      function currentMotor() {
        const motor = { ...motorPorts[motorPortIndex] };
        if (previewScenario === &#x27;identifying&#x27; &amp;&amp; motorPortIndex === 0) motor.connection = &#x27;detecting&#x27;;
        return motor;
      }

      function currentSensor() {
        const sensor = { ...sensorPorts[sensorPortIndex] };
        if (previewScenario === &#x27;disconnected&#x27; &amp;&amp; sensorPortIndex === 0) sensor.connection = &#x27;disconnected&#x27;;
        return sensor;
      }

      const portLabels = [&#x27;A&#x27;, &#x27;B&#x27;, &#x27;C&#x27;, &#x27;D&#x27;, &#x27;1&#x27;, &#x27;2&#x27;, &#x27;3&#x27;, &#x27;4&#x27;];

      function selectedPortPosition() {
        return portGroup === &#x27;motors&#x27; ? motorPortIndex : sensorPortIndex + 4;
      }

      function setPortPosition(position) {
        if (position &lt; 4) {
          portGroup = &#x27;motors&#x27;;
          motorPortIndex = position;
        } else {
          portGroup = &#x27;sensors&#x27;;
          sensorPortIndex = position - 4;
        }
      }

      function movePort(delta) {
        setPortPosition((selectedPortPosition() + delta + portLabels.length) % portLabels.length);
      }

      function selectedPortLabel() {
        return portLabels[selectedPortPosition()];
      }

      function drawPortSelector() {
        const selected = selectedPortPosition();
        for (let index = 0; index &lt; portLabels.length; index += 1) {
          const x = 2 + index * 22;
          const label = portLabels[index];
          const style = index === selected ? &#x27;compact-inverse&#x27; : &#x27;compact&#x27;;
          if (index === selected) fillRegion(x, 21, 20, 16, true);
          drawText(x + Math.floor((20 - textWidth(label, &#x27;compact&#x27;)) / 2), 21, label, style);
        }
        drawLine(0, 38, LCD_WIDTH - 1, 38);
      }

      function drawMotorDetail() {
        const motor = currentMotor();
        let state = t(&#x27;disconnected&#x27;);
        let kind = &#x27;--&#x27;;
        let speed = &#x27;--&#x27;;
        let angle = &#x27;--&#x27;;
        if (motor.connection === &#x27;detecting&#x27;) {
          state = t(&#x27;detecting&#x27;);
        } else if (motor.connection === &#x27;connected&#x27;) {
          kind = t(motor.kind);
          state = t(motor.state);
          speed = `${motor.speed}%`;
          angle = `${Math.max(-999, Math.min(999, motor.angle))}`;
        }
        drawText(4, 47, `${selectedPortLabel()}:`, &#x27;compact&#x27;);
        drawText(24, 47, kind, &#x27;compact&#x27;);
        drawTextRight(47, state);
        drawLabelPrefix(4, 70, &#x27;SPEED&#x27;);
        drawTextRight(70, speed);
        drawLabelPrefix(4, 94, &#x27;ANGLE&#x27;);
        drawTextRight(94, angle);
      }

      function currentSensorMode(sensor) {
        const modes = sensor.modes || [{ label: &#x27;VALUE&#x27;, value: sensor.value || &#x27;--&#x27; }];
        return modes[sensorViewIndices[sensorPortIndex] % modes.length];
      }

      function drawSensorDetail() {
        const sensor = currentSensor();
        let connection = t(&#x27;disconnected&#x27;);
        let model = &#x27;--&#x27;;
        let mode = { label: &#x27;VALUE&#x27;, value: &#x27;--&#x27; };
        if (sensor.connection === &#x27;detecting&#x27;) {
          connection = t(&#x27;detecting&#x27;);
        } else if (sensor.connection === &#x27;connected&#x27;) {
          connection = t(&#x27;connected&#x27;);
          model = sensor.model;
          mode = currentSensorMode(sensor);
        }
        drawText(4, 47, `${selectedPortLabel()}:`, &#x27;compact&#x27;);
        drawText(24, 47, model, &#x27;compact&#x27;);
        drawTextRight(47, connection);
        drawLabelPrefix(4, 68, &#x27;TYPE&#x27;);
        drawTextRight(68, mode.label);
        drawCentered(87, mode.value);
        if (sensor.connection === &#x27;connected&#x27;) {
          drawText(LCD_WIDTH - textWidth(&#x27;OK TYPE&#x27;, &#x27;compact&#x27;) - 4, 107, &#x27;OK TYPE&#x27;, &#x27;compact&#x27;);
        }
      }

      function drawPorts() {
        drawPageTitle(t(&#x27;portsTitle&#x27;));
        drawPortSelector();
        if (portGroup === &#x27;motors&#x27;) drawMotorDetail();
        else drawSensorDetail();
      }

      function drawSettingRow(index, label, value) {
        const y = 21 + index * 23;
        const selected = settingsIndex === index;
        const style = selected ? &#x27;inverse&#x27; : &#x27;normal&#x27;;
        if (selected) fillRegion(1, y, LCD_WIDTH - 2, 16, true);
        drawText(4, y, label, style);
        drawText(LCD_WIDTH - textWidth(value, style) - 4, y, value, style);
      }

      function currentLanguageLabel() {
        if (language === &#x27;Chinese&#x27;) return t(&#x27;chinese&#x27;);
        if (language === &#x27;Portuguese&#x27;) return t(&#x27;portuguese&#x27;);
        return &#x27;English&#x27;;
      }

      function drawSettings() {
        drawPageTitle(t(&#x27;settings&#x27;));
        drawSettingRow(0, t(&#x27;backlight&#x27;), `${backlight}%`);
        drawSettingRow(1, t(&#x27;volume&#x27;), `${volume}%`);
        drawSettingRow(2, t(&#x27;language&#x27;), currentLanguageLabel());
        drawSettingRow(3, t(&#x27;deviceInfo&#x27;), &#x27;&gt;&#x27;);
      }

      function drawInfoRow(y, label, value) {
        drawText(5, y, label, &#x27;compact&#x27;);
        drawText(80, y, value, &#x27;compact&#x27;);
      }

      function drawDeviceInfo() {
        drawPageTitle(t(&#x27;deviceInfo&#x27;));
        drawInfoRow(24, t(&#x27;model&#x27;), &#x27;EST 3.0&#x27;);
        drawInfoRow(44, t(&#x27;firmware&#x27;), &#x27;M1.18A&#x27;);
        drawInfoRow(64, t(&#x27;bootloader&#x27;), &#x27;03.00B&#x27;);
        drawInfoRow(84, t(&#x27;usb&#x27;), &#x27;USB ON&#x27;);
        drawInfoRow(104, t(&#x27;battery&#x27;), `${batteryPercent()}%`);
      }

      function drawError() {
        drawCentered(30, t(&#x27;programStopped&#x27;));
        drawCentered(53, t(&#x27;motorsStopped&#x27;), &#x27;compact&#x27;);
        drawCentered(78, `E:${errorCode}`);
        drawCentered(105, t(&#x27;retry&#x27;), &#x27;compact&#x27;);
      }

      function render() {
        lcdPixels.fill(0);
        lcd.style.filter = page === &#x27;off&#x27; ? &#x27;brightness(0.2)&#x27; : `brightness(${0.55 + backlight * 0.0045})`;
        if (page === &#x27;main&#x27; || page === &#x27;power&#x27;) drawHome();
        if (page === &#x27;power&#x27;) drawPowerConfirm();
        if (page === &#x27;programs&#x27;) drawPrograms();
        if (page === &#x27;delete&#x27;) drawDeleteConfirm();
        if (page === &#x27;running&#x27;) drawRunning();
        if (page === &#x27;remote&#x27;) drawRemoteControl();
        if (page === &#x27;motor&#x27;) drawMotorOutput();
        if (page === &#x27;ports&#x27;) drawPorts();
        if (page === &#x27;settings&#x27;) drawSettings();
        if (page === &#x27;info&#x27;) drawDeviceInfo();
        if (page === &#x27;error&#x27;) drawError();
        if (transferActive) drawProgramTransferPopup();
        flushLcd();
        lcd.setAttribute(&#x27;aria-label&#x27;, `EST LCD ${transferActive ? `${page} transfer` : page}, 180 by 128 pixels`);
      }

      function moveMain(delta) {
        const fromMotion = homeMotionState();
        mainIndex = (mainIndex + delta + mainActions.length) % mainActions.length;
        if (mainIndex &lt; homeFirstIndex) homeFirstIndex = mainIndex;
        if (mainIndex &gt;= homeFirstIndex + 4) homeFirstIndex = mainIndex - 3;
        startHomeAnimation(fromMotion);
      }

      function moveProgram(delta) {
        const count = visiblePrograms().length;
        if (count === 0) return;
        programIndex = (programIndex + delta + count) % count;
      }

      function markProgramRecent(program) {
        quickProgramIndex = programs.indexOf(program);
        if (previewScenario === &#x27;no-recent&#x27;) {
          previewScenario = &#x27;normal&#x27;;
          scenarioSelect.value = &#x27;normal&#x27;;
        }
      }

      function adjustSetting(delta) {
        if (settingsIndex === 0) backlight = Math.max(10, Math.min(100, backlight + delta * 10));
        if (settingsIndex === 1) volume = Math.max(0, Math.min(100, volume + delta * 10));
        if (settingsIndex === 2) {
          const current = languages.indexOf(language);
          language = languages[(current + delta + languages.length) % languages.length];
        }
      }

      function clearTransferSimulation() {
        if (transferTimer) clearInterval(transferTimer);
        transferTimer = null;
        transferActive = false;
        transferProgress = 0;
      }

      function finishProgramTransfer() {
        clearTransferSimulation();
        if (previewScenario === &#x27;program-transfer&#x27;) {
          previewScenario = &#x27;normal&#x27;;
          scenarioSelect.value = &#x27;normal&#x27;;
        }
        render();
      }

      function beginProgramTransfer() {
        transferActive = true;
        transferProgress = 0;
        if (transferTimer) clearInterval(transferTimer);
        transferTimer = setInterval(() =&gt; {
          transferProgress = Math.min(1, transferProgress + 0.08);
          if (transferProgress &gt;= 1) {
            finishProgramTransfer();
          } else {
            render();
          }
        }, 160);
      }

      function setPreviewScenario(nextScenario) {
        clearTransferSimulation();
        stopHomeAnimation();
        previewScenario = nextScenario;
        scenarioSelect.value = nextScenario;
        page = &#x27;main&#x27;;
        mainIndex = 0;
        homeFirstIndex = 0;
        programIndex = 0;
        deleteChoice = 0;
        errorCode = 0;
        errorReturn = &#x27;main&#x27;;
        portGroup = &#x27;motors&#x27;;
        motorPortIndex = 0;
        sensorPortIndex = 0;
        sensorViewIndices.fill(0);
        resetRemoteControl();
        quickProgramIndex = programs.findIndex(program =&gt; program.saved);

        if (nextScenario === &#x27;no-recent&#x27;) quickProgramIndex = -1;
        if (nextScenario === &#x27;program-error&#x27;) {
          page = &#x27;error&#x27;;
          errorCode = 1101;
          errorReturn = &#x27;programs&#x27;;
        }
        if (nextScenario === &#x27;storage-error&#x27;) page = &#x27;programs&#x27;;
        if (nextScenario === &#x27;identifying&#x27;) page = &#x27;ports&#x27;;
        if (nextScenario === &#x27;disconnected&#x27;) {
          page = &#x27;ports&#x27;;
          portGroup = &#x27;sensors&#x27;;
        }
        if (isRemoteFaultScenario(nextScenario)) {
          enterRemoteControl();
          brakeRemoteMotors(nextScenario);
        }
        if (nextScenario === &#x27;program-transfer&#x27;) beginProgramTransfer();
        render();
      }

      function startProgram(program = selectedProgram()) {
        if (!program) return;
        if (previewScenario === &#x27;low-battery&#x27;) {
          errorCode = 1201;
          errorReturn = &#x27;programs&#x27;;
          page = &#x27;error&#x27;;
          render();
          return;
        }
        markProgramRecent(program);
        page = &#x27;running&#x27;;
        render();
      }

      function stopProgram() {
        stopHomeAnimation();
        page = &#x27;main&#x27;;
        mainIndex = 0;
        homeFirstIndex = 0;
        render();
      }

      function deleteSelectedProgram() {
        const program = selectedProgram();
        if (!program) return;
        if (programs.indexOf(program) === quickProgramIndex) quickProgramIndex = -1;
        program.saved = false;
        programIndex = Math.max(0, Math.min(programIndex, visiblePrograms().length - 1));
      }

      function leaveTransientScenario() {
        if (previewScenario === &#x27;program-error&#x27;) {
          previewScenario = &#x27;normal&#x27;;
          scenarioSelect.value = &#x27;normal&#x27;;
        }
      }

      function press(key) {
        if (page === &#x27;off&#x27;) return;
        if (transferActive) return;

        if (page === &#x27;main&#x27;) {
          if (key === &#x27;up&#x27; || key === &#x27;left&#x27;) moveMain(-1);
          if (key === &#x27;down&#x27; || key === &#x27;right&#x27;) moveMain(1);
          if (key === &#x27;back&#x27;) {
            stopHomeAnimation();
            page = &#x27;power&#x27;;
          }
          if (key === &#x27;ok&#x27;) {
            const action = mainActions[mainIndex];
            if (action === &#x27;quick&#x27;) {
              const program = quickProgramIndex &gt;= 0 ? programs[quickProgramIndex] : null;
              if (program &amp;&amp; program.saved) {
                stopHomeAnimation();
                startProgram(program);
